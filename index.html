<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rafa Evalúa</title>
<meta name="description" content="Evaluación formativa por campos formativos de la Nueva Escuela Mexicana.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rafa Evalúa">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#F2F4EF}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="theme-color" content="#1D5240">
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url('./atkinson-400.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url('./atkinson-700.woff2') format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600;font-display:swap;src:url('./bricolage-600.woff2') format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url('./bricolage-700.woff2') format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url('./bricolage-800.woff2') format('woff2')}

/* Layout: una sola columna tipo app (máx. 760px), barra superior fija, acciones principales en barra inferior al alcance del pulgar */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#15211C; --muted:#56655E; --line:#D3DBD3;
  --brand:#1D5240; --brand-soft:#DCEAE2; --on-brand:#FFFFFF;
  --accent:#E39B12; --accent-soft:#FBEBC8; --on-accent:#1E1400;
  --danger:#B3321F; --danger-soft:#F8DFD9; --on-danger:#FFFFFF; --ok:#2E7D4F;
  --f-len:#C4511A; --f-spc:#1F67A8; --f-ens:#3C7F2E; --f-hyc:#8B3E98;
  --scrim:rgba(8,18,14,.55);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#17221E; --surface-2:#1F2C27; --ink:#E6EEEA; --muted:#9BACA4; --line:#2C3B35;
  --brand:#62C29B; --brand-soft:#1C3A2F; --on-brand:#06140F;
  --accent:#F2B441; --accent-soft:#3A2C0E; --on-accent:#1E1400;
  --danger:#F08068; --danger-soft:#3D1E18; --on-danger:#1A0805; --ok:#6CCB8F;
  --f-len:#F08A55; --f-spc:#6FAEE8; --f-ens:#86C673; --f-hyc:#CD8BDA;
  --scrim:rgba(0,0,0,.65); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17221E; --surface-2:#1F2C27; --ink:#E6EEEA; --muted:#9BACA4; --line:#2C3B35;
  --brand:#62C29B; --brand-soft:#1C3A2F; --on-brand:#06140F;
  --accent:#F2B441; --accent-soft:#3A2C0E; --on-accent:#1E1400;
  --danger:#F08068; --danger-soft:#3D1E18; --on-danger:#1A0805; --ok:#6CCB8F;
  --f-len:#F08A55; --f-spc:#6FAEE8; --f-ens:#86C673; --f-hyc:#CD8BDA;
  --scrim:rgba(0,0,0,.65); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 128px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:where(button,input,select,textarea,a):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;margin-inline:-16px;padding:8px 16px 8px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.icon-btn{width:48px;height:48px;border-radius:12px;font-size:24px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.tb-title{min-width:0}
.tb-title h1{font-family:var(--display);font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{margin:0;color:var(--muted);font-size:14px}

/* Inicio */
.brandbar{display:flex;align-items:center;gap:16px;padding-block:24px 16px}
.logo{width:58px;height:58px;border-radius:17px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;position:relative;font-family:var(--display);font-weight:800;font-size:32px;flex:none}
.logo i{position:absolute;right:-7px;bottom:-7px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-style:normal;font-size:15px;font-weight:800;display:grid;place-items:center;border:3px solid var(--bg)}
.brand{font-family:var(--display);font-weight:800;font-size:31px;letter-spacing:-.02em;margin:0;line-height:1.05}
.tag{margin:4px 0 0;color:var(--muted);font-size:15px}
.home{display:flex;flex-direction:column;gap:14px}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.notice.warn{background:var(--danger-soft)}
.context{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ctx-label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);grid-column:1}
.context strong{font-family:var(--display);font-size:26px;line-height:1.1;grid-column:1}
.ctx-meta{font-size:15px;color:var(--muted);grid-column:1}
.chev{grid-column:2;grid-row:1 / span 3;font-size:30px;color:var(--muted)}
.tile-main{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:20px 18px;min-height:104px}
.tile-main .tm-ico{font-size:36px;line-height:1}
.tile-main strong{display:block;font-family:var(--display);font-size:25px;line-height:1.1}
.tile-main small{display:block;font-size:14px;opacity:.85;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:104px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.tile .ico{font-size:28px;line-height:1}
.tile strong{font-size:18px}
.tile.soon{opacity:.6}
.tile .soon-tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.row-link{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:700}
.row-link .chev2{margin-left:auto;color:var(--muted);font-size:24px}

/* Asistente */
.progress{display:flex;gap:4px;margin-top:14px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress .done{background:var(--brand)}
.progress .cur{background:var(--accent)}
.stepname{margin:8px 0 0;font-size:14px;color:var(--muted);letter-spacing:.02em}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trail button{font-size:14px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q{font-family:var(--display);font-size:25px;font-weight:700;margin:16px 0 12px;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:700;flex:none}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.badge.cur{background:var(--brand-soft);color:var(--brand)}
.badge.test{background:var(--accent-soft);color:var(--ink)}
.chip .badge{margin-left:6px}
.search input,.field input,.field select,textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
textarea{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.4}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.row-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.row-btn.on{border-color:var(--brand);background:var(--brand-soft)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.7em;font-size:15px;flex:none}
.nm{min-width:0;overflow-wrap:anywhere}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:12px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;font-size:19px;font-weight:700}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.choice .meta{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.choice .tick{margin-left:auto;color:var(--brand);font-size:22px}
.fc{border-left:10px solid var(--fc)}
.f-len{--fc:var(--f-len)} .f-spc{--fc:var(--f-spc)} .f-ens{--fc:var(--f-ens)} .f-hyc{--fc:var(--f-hyc)}
.choice .fi{font-size:28px;flex:none}
.prev{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-top:4px}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.score{min-height:100px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.score.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.obs-chips{display:flex;flex-wrap:wrap;gap:8px}
.obs-chip{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:16px}
.obs-chip.on{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.hint{font-size:15px;color:var(--muted);margin:10px 0 0}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* Confirmación */
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.confirm h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.confirm dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;margin:14px 0 0}
.confirm dt{color:var(--muted);font-size:14px;padding-top:2px}
.confirm dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.confirm dd.obs{font-weight:400;font-style:italic}
.confirm dd .dd-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-weight:700;min-height:36px;padding:2px 6px;margin:-2px -6px;border-radius:8px}
.confirm dd .dd-btn:hover{background:var(--surface-2)}
.confirm dd .dd-btn > span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.confirm dd .dd-btn i{font-weight:400}
.confirm .pen{color:var(--muted);font-size:16px;flex:none}
.confirm dd.static{padding-top:2px}
.confirm dt{padding-top:8px}
.confirm .hint{margin-top:14px}
.bigscore{display:inline-grid;place-items:center;min-width:56px;height:48px;padding:0 10px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}

/* Barra inferior y botones */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bottom .inner{max-width:728px;margin:0 auto;display:flex;gap:10px}
.btn{min-height:54px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;text-align:center;line-height:1.15}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.block{flex:1;width:100%}
.btn.sm{min-height:42px;padding:0 12px;font-size:15px;border-radius:10px}
.link-danger{color:var(--danger);font-weight:700;margin-top:18px;min-height:44px;text-decoration:underline}

/* Grupos y alumnos */
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.headrow h2{font-family:var(--display);font-size:20px;margin:0}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gcard.off{opacity:.7}
.gcard h3{font-family:var(--display);font-size:24px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gcard p{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.tab{flex:1;min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.srow .who{flex:1 1 200px;min-width:0}
.srow .who small{display:block;color:var(--muted);font-size:14px}

/* Importar lista */
.imp-sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.imp-sec h2{font-family:var(--display);font-size:20px;margin:0}
.field select{appearance:auto}
.filepick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:112px;border:2px dashed var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:center;padding:12px 16px}
.filepick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.filepick b{font-size:19px;overflow-wrap:anywhere}
.filepick small{color:var(--muted);font-size:14px}
.filepick{position:relative}
.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filepick.loaded{border-style:solid;border-color:var(--brand)}
.err{background:var(--danger-soft);border-radius:12px;padding:10px 14px;margin:0}
.checkline{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.checkline input,.irow input{width:24px;height:24px;accent-color:var(--brand);flex:none;margin:0}
.sumline{display:flex;flex-wrap:wrap;gap:6px}
.sumline .badge{font-size:13px;padding:4px 10px}
.irow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;min-height:52px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.irow.locked{opacity:.62}
.irow .nm{flex:1 1 140px;min-width:0}
.irow .badge{flex:none;margin-left:auto}
.badge.warn{background:var(--danger-soft);color:var(--ink)}

/* Fase 2: concentración, historial, actividades */
.btn.danger-ghost{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpis b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpis span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
table.conc{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:16px}
.conc th,.conc td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.conc thead th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 6px 8px;background:var(--surface);position:sticky;top:0}
.conc thead th.fh{border-top:5px solid var(--fc)}
.conc .c-name{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 10px;min-width:150px;max-width:190px;white-space:normal;border-right:1px solid var(--line);font-weight:400}
.conc thead .c-name{z-index:2}
.conc tbody .c-name{display:flex;gap:6px;align-items:baseline}
.conc tbody .c-name .nm{font-size:15px;line-height:1.25}
.conc .c-avg{padding:6px 10px;border-left:1px solid var(--line);font-size:17px}
.conc .c-avg sup{color:var(--muted);font-size:12px}
.conc tfoot th,.conc tfoot td{background:var(--surface-2);font-weight:700;padding:10px 6px;border-bottom:0}
.conc tfoot .c-name{background:var(--surface-2);font-weight:700;font-size:14px}
.conc tbody tr:last-child th,.conc tbody tr:last-child td{border-bottom:2px solid var(--line)}
.cell{width:100%;min-width:64px;min-height:48px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.cell:hover{background:var(--surface-2)}
.lv-pend{color:var(--muted);font-weight:400}
.cell.lv-low,.score-pill.lv-low{background:var(--danger-soft);color:var(--danger)}
.cell.lv-mid,.score-pill.lv-mid{background:var(--accent-soft)}
b.lv-low{color:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.sw.lv-low{background:var(--danger-soft);border:1px solid var(--danger)}
.sw.lv-mid{background:var(--accent-soft);border:1px solid var(--accent)}
.score-pill{flex:none;display:inline-grid;place-items:center;min-width:48px;height:44px;padding:0 8px;border-radius:12px;background:var(--brand-soft);color:var(--ink);font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.filters .field label{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:4px;display:block}
.filters .field select,.filters .field input{min-height:48px;font-size:16px;padding:0 10px}
.filters .field.two{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.filters{grid-template-columns:1fr}}
.histsum{margin:14px 0 4px;color:var(--muted)}
.histsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.evcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:8px;border-left-color:var(--fc);border-radius:14px;padding:10px 12px}
.ev-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-who{font-weight:700;overflow-wrap:anywhere}
.ev-what{font-size:15px}
.ev-meta{font-size:14px;color:var(--muted)}
.ev-obs{font-size:14px;font-style:italic;color:var(--muted)}
.ev-mini .nm{flex:1;display:flex;flex-direction:column}

<script>
'use strict';
/* ============================================================
   Rafa Evalúa · Fase 1
   Datos locales (IndexedDB), grupos, alumnos y flujo de Nueva evaluación.
   Cada registro lleva id (UUID), created_at y updated_at para permitir
   sincronización en la nube en una versión posterior.
   ============================================================ */

/* ---------- Catálogos fijos ---------- */
const FIELDS = [
  {id:'LEN', name:'Lenguajes', cls:'f-len', icon:'💬'},
  {id:'SPC', name:'Saberes y Pensamiento Científico', cls:'f-spc', icon:'🔬'},
  {id:'ENS', name:'Ética, Naturaleza y Sociedades', cls:'f-ens', icon:'🌎'},
  {id:'HYC', name:'De lo Humano y lo Comunitario', cls:'f-hyc', icon:'🤝'}
];
const PERIODS = [
  {id:'P1', name:'1er Periodo'},
  {id:'P2', name:'2do Periodo'},
  {id:'P3', name:'3er Periodo'}
]; // La Evaluación Anual se calcula a partir de los tres periodos; no se registra directamente.
const SCORES = [5,6,7,8,9,10];

/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
const coll = new Intl.Collator('es', {sensitivity:'base', numeric:true});
const byName = (a,b) => coll.compare(a.name, b.name);
const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
const fieldOf = id => FIELDS.find(f => f.id === id);
const periodOf = id => PERIODS.find(p => p.id === id);
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'}); } catch(e){ return ''; } };

/* ---------- Capa de datos ---------- */
const STORES = ['groups','students','activities','evaluations','observations','settings'];
const DB = {
  idb:null, persistent:false, durable:false, cache:{},
  async init(){
    STORES.forEach(s => this.cache[s] = new Map());
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('rafa-evalua', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          STORES.forEach(s => {
            if (!d.objectStoreNames.contains(s)) {
              const os = d.createObjectStore(s, {keyPath:'id'});
              if (s === 'evaluations') os.createIndex('student_id', 'student_id');
              if (s === 'students') os.createIndex('group_id', 'group_id');
            }
          });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('bloqueado'));
      });
      for (const s of STORES) (await this._all(s)).forEach(x => this.cache[s].set(x.id, x));
      this.persistent = true;
      try { if (navigator.storage && navigator.storage.persist) this.durable = await navigator.storage.persist(); } catch(e){}
    } catch(e) { this.idb = null; this.persistent = false; }
  },
  _all(s){ return new Promise((res, rej) => { const q = this.idb.transaction(s,'readonly').objectStore(s).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  _tx(s, fn){
    if (!this.idb) return Promise.resolve();
    return new Promise((res, rej) => {
      try { const tx = this.idb.transaction(s, 'readwrite'); fn(tx.objectStore(s)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('cancelado')); }
      catch(e){ rej(e); }
    });
  },
  stamp(rec){ const now = new Date().toISOString(); rec.updated_at = now; if (!rec.created_at) rec.created_at = now; return rec; },
  list(s){ return [...this.cache[s].values()]; },
  get(s, id){ return id ? this.cache[s].get(id) : undefined; },
  async put(s, rec){ this.stamp(rec); this.cache[s].set(rec.id, rec); await this._tx(s, os => os.put(rec)); return rec; },
  async putMany(s, recs){ recs.forEach(r => { this.stamp(r); this.cache[s].set(r.id, r); }); await this._tx(s, os => recs.forEach(r => os.put(r))); },
  async del(s, id){ this.cache[s].delete(id); await this._tx(s, os => os.delete(id)); },
  async replaceAll(data){
    // Restaurar: vacía cada almacén y escribe lo del respaldo en una sola transacción.
    STORES.forEach(st => this.cache[st] = new Map((data[st] || []).map(r => [r.id, r])));
    if (!this.idb) return;
    await new Promise((res, rej) => {
      const tx = this.idb.transaction(STORES, 'readwrite');
      STORES.forEach(st => { const os = tx.objectStore(st); os.clear(); (data[st] || []).forEach(r => os.put(r)); });
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('cancelado'));
    });
  },
  async delMany(s, ids){ ids.forEach(id => this.cache[s].delete(id)); await this._tx(s, os => ids.forEach(id => os.delete(id))); }
};

/* ---------- Consultas ---------- */
function settings(){ return DB.get('settings','app') || {id:'app', currentGroupId:null, lastPeriod:'P1', seeded:false}; }
/* Datos para los reportes: el docente y el ciclo son generales; escuela, CCT y turno van en cada grupo. */
const TURNOS = ['Matutino', 'Vespertino', 'Tiempo completo', 'Nocturno'];
const DEFAULT_SCHOOLS = [
  {name:'Gertrudis Bocanegra', cct:'02DPR0049N', turno:'Matutino'},
  {name:'Ignacio Manuel Altamirano', cct:'02DPR0324B', turno:'Vespertino'}
];
const schools = () => settings().schools || [];
function schoolLine(g){
  if (!g || !g.school) return '';
  return [g.school, g.cct && 'CCT ' + g.cct, g.turno && 'Turno ' + g.turno].filter(Boolean).join(' · ');
}
// Sugerencia por grado: 3.º → Gertrudis Bocanegra, 6.º → Ignacio Manuel Altamirano (si siguen en la lista de escuelas).
function guessSchool(name){
  const n = (String(name).match(/\d/) || [])[0];
  const target = n === '3' ? DEFAULT_SCHOOLS[0].name : n === '6' ? DEFAULT_SCHOOLS[1].name : null;
  const sc = target && schools().find(x => x.name === target);
  return sc ? {school:sc.name, cct:sc.cct, turno:sc.turno} : {};
}
async function migrateSchools(){
  const st = settings();
  if (st.schoolsSeeded) return;
  const patch = {schoolsSeeded:true, schools: st.schools || DEFAULT_SCHOOLS, teacher: st.teacher ?? '', cycle: st.cycle ?? '2026-2027'};
  // Grupos existentes sin escuela: 3.º → Gertrudis Bocanegra (matutino), 6.º → Ignacio Manuel Altamirano (vespertino).
  const upd = DB.list('groups').filter(g => !g.school).map(g => {
    const n = (g.name.match(/\d/) || [])[0];
    const sc = n === '3' ? DEFAULT_SCHOOLS[0] : n === '6' ? DEFAULT_SCHOOLS[1] : null;
    return sc ? {...g, school:sc.name, cct:sc.cct, turno:sc.turno} : null;
  }).filter(Boolean);
  if (upd.length) await DB.putMany('groups', upd);
  await saveSettings(patch);
}
async function saveSettings(patch){ await DB.put('settings', {...settings(), ...patch}); }
const groups = () => DB.list('groups').sort(byName);
const activeGroups = () => groups().filter(g => g.active);
function currentGroup(){ const g = DB.get('groups', settings().currentGroupId); return g && g.active ? g : null; }
const studentsOf = (gid, active=true) => DB.list('students').filter(s => s.group_id === gid && s.active === active).sort(byName);
const evalsOfStudent = sid => DB.list('evaluations').filter(e => e.student_id === sid);
const activitiesOf = fid => DB.list('activities').filter(a => a.field === fid && a.active).sort(byName);
const observations = () => DB.list('observations').filter(o => o.active).sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
function findEval(sid, period, field, actId, exceptId){
  return DB.list('evaluations').find(e => e.student_id === sid && e.period === period && e.field === field && e.activity_id === actId && e.id !== exceptId);
}
const testTag = x => x && x.sample ? ' <span class="badge test">Prueba</span>' : '';

/* ---------- Datos iniciales ---------- */
async function seedCatalog(){
  const acts = {
    LEN:['Comprensión lectora','Producción de textos','Descripción de textos','Lectura en voz alta'],
    SPC:['Cálculo mental','Resolución de problemas','Indagación científica'],
    ENS:['Línea del tiempo','Lectura de mapas','Análisis de casos'],
    HYC:['Trabajo colaborativo','Educación física','Hábitos saludables']
  };
  const recs = [];
  Object.entries(acts).forEach(([field, names]) => names.forEach(name => recs.push({id:uid(), field, name, active:true})));
  await DB.putMany('activities', recs);
  const obs = ['Trabaja con autonomía.','Participó activamente.','Explica su procedimiento.','Requiere apoyo.','Necesita fortalecer la comprensión de textos.','Expresa sus ideas con claridad.'];
  await DB.putMany('observations', obs.map((text, i) => ({id:uid(), text, active:true, order:i})));
}

async function seedSample(){

let route = {name:'home', params:{}};
function go(name, params={}, replace=false){
  route = {name, params};

  try { history[replace ? 'replaceState' : 'pushState']({route, idx: replace ? idx : idx + 1}, ''); } catch(e){}

}

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

let modalResolve = null;
function openModal({title, body='', actions=[], onSubmit}){
  return new Promise(res => {
    closeModal(null);
    modalResolve = res;
    const root = $('#modal-root');
    root.innerHTML = `<div class="scrim" data-act="modal-dismiss"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <h2 id="m-title">${esc(title)}</h2>
        <div class="m-body">${body}</div>
        <p class="m-err" id="m-err" hidden></p>
        <div class="m-actions">${actions.map((a,i) => `<button class="btn ${a.kind || 'ghost'}" data-act="modal-btn" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>
      </div>`;
    root._actions = actions; root._onSubmit = onSubmit;
    root.hidden = false;
    setTimeout(() => { const f = root.querySelector('input,select,textarea') || root.querySelector('.btn'); f && f.focus(); }, 40);
  });
}
function closeModal(value){
  const root = $('#modal-root');
  if (!root || root.hidden) return;
  root.hidden = true; root.innerHTML = '';
  const r = modalResolve; modalResolve = null; r && r(value);
}
function modalButton(i){
  const root = $('#modal-root'), a = root._actions[i];
  if (a.submit && root._onSubmit) {
    const out = root._onSubmit(root);
    if (typeof out === 'string') { const er = $('#m-err'); er.textContent = out; er.hidden = false; return; }
    closeModal({value:a.value, data:out});
  } else closeModal({value:a.value});
}
async function confirmBox(title, html, okLabel, kind='danger'){
  const r = await openModal({title, body:html, actions:[{label:'Cancelar', value:false}, {label:okLabel, kind, value:true}]});
  return !!(r && r.value === true);
}
async function safe(fn, okMsg){
  let ok = true;
  try { await fn(); if (okMsg) toast(okMsg); }
  catch(e){ ok = false; toast('No se pudo guardar: ' + (e && e.message ? e.message : 'error')); }
  render();
  return ok;
}

const STEPS = ['Alumno','Periodo','Campo formativo','Actividad','Calificación','Observación','Confirmar'];
let W = null;      // estado del asistente
let LAST = null;   // última evaluación guardada

function startEval(){
  const g = currentGroup() || activeGroups()[0];
  if (!g) { toast('Primero crea un grupo.'); go('groups'); return; }
  W = {groupId:g.id, studentId:null, period:settings().lastPeriod || 'P1', field:null, activityId:null, score:null, obs:'', obsDone:false, editingId:null, saving:false, review:false, from:null};

}
// Abre una evaluación registrada directamente en la pantalla de confirmación, lista para cambiar cualquier dato.
function startEdit(id, from){
  const e = DB.get('evaluations', id); if (!e) { toast('Esa evaluación ya no existe.'); return; }
  const st = DB.get('students', e.student_id);
  W = {groupId: st ? st.group_id : null, studentId:e.student_id, period:e.period, field:e.field, activityId:e.activity_id, score:e.score, obs:e.observation || '', obsDone:true, editingId:id, saving:false, review:true, from: from || null};
  go('eval', {step:6});
}
// Avanza al paso indicado; si ya se había llegado a la confirmación, vuelve a ella cuando todo sigue completo.
function advance(n){ go('eval', {step: W.review ? Math.min(6, reachable()) : n}, W.review); }
function reachable(){
  if (!W.studentId) return 0;
  if (!W.period) return 1;
  if (!W.field) return 2;
  if (!W.activityId) return 3;
  if (W.score == null) return 4;
  return W.obsDone ? 6 : 5;
}
VIEWS.eval = p => {
  if (!W) { setTimeout(() => go('home', {}, true)); return ''; }
  const step = Math.max(0, Math.min(p.step | 0, reachable()));
  const st = DB.get('students', W.studentId), f = fieldOf(W.field), a = DB.get('activities', W.activityId), per = periodOf(W.period);
  const trailItems = [
    st && [0, st.name], W.studentId && per && [1, per.name], f && [2, f.name], a && [3, a.name], W.score != null && [4, 'Calificación ' + W.score],
    W.review && [5, W.obs ? 'Observación' : 'Sin observación']
  ].filter(Boolean).filter(([i]) => step < 6 && i !== step && (W.review || i < step));
  const head = `${topbar(W.editingId ? 'Editar evaluación' : 'Nueva evaluación')}
    <div class="progress" aria-hidden="true">${STEPS.map((_, i) => `<span class="${i < step ? 'done' : i === step ? 'cur' : ''}"></span>`).join('')}</div>

  return head + STEP_VIEWS[step]();
};

function pickRows(q){
  const list = studentsOf(W.groupId, true);
  const cur = DB.get('students', W.studentId);
  if (cur && !cur.active && cur.group_id === W.groupId) list.unshift({...cur, name: cur.name + ' (inactivo)'});
  const shown = list.map((s, i) => [s, i]).filter(([s]) => !q || norm(s.name).includes(q));
  if (!list.length) return `<li class="empty">Este grupo no tiene alumnos activos. Agrégalos en la sección Alumnos.</li>`;
  if (!shown.length) return `<li class="empty">Ningún alumno coincide con la búsqueda.</li>`;
  return shown.map(([s, i]) => `<li><button class="row-btn ${s.id === W.studentId ? 'on' : ''}" data-act="w-student" data-id="${s.id}"><span class="num">${i + 1}</span><span class="nm">👨‍🎓 ${esc(s.name)}</span></button></li>`).join('');
}
function obsChips(){
  const list = observations();
  if (!list.length) return '<p class="hint">No hay observaciones en el catálogo.</p>';
  return list.map(o => `<button class="obs-chip ${W.obs === o.text ? 'on' : ''}" data-act="w-obs" data-id="${o.id}">${esc(o.text)}</button>`).join('');

async function saveEval(){
  if (!W || W.saving) return;
  const st = DB.get('students', W.studentId), a = DB.get('activities', W.activityId);
  if (!st || !a || W.score == null) { toast('Faltan datos para guardar.'); return; }
  const dup = findEval(W.studentId, W.period, W.field, W.activityId, W.editingId);
  let target = null, removeId = null;
  if (dup) {
    const r = await openModal({
      title: '⚠️ Evaluación ya registrada',
      body: `<p>Este alumno ya tiene una evaluación registrada para esta actividad.</p>
        <div class="dup-card"><b>${esc(st.name)}</b><br>${periodOf(dup.period).name} · ${esc(a.name)}<br>Registrada el ${fmtDate(dup.date)} · Puntaje <b>${dup.score}</b>${dup.observation ? `<br><i>${esc(dup.observation)}</i>` : ''}</div>
        <p class="hint">Nueva calificación que intentas guardar: <b>${W.score}</b></p>`,
      actions: [{label:'Cancelar', value:'cancel'}, {label:'Editar evaluación existente', value:'edit'}, {label:'Reemplazar evaluación', kind:'primary', value:'replace'}]
    });
    const v = r && r.value;
    if (v === 'edit') {
      Object.assign(W, {editingId:dup.id, score:dup.score, obs:dup.observation || '', obsDone:true, review:true});
      go('eval', {step:4}, true); toast('Editando la evaluación existente: elige la calificación'); return;
    }
    if (v !== 'replace') return;
    target = dup;
    if (W.editingId && W.editingId !== dup.id) removeId = W.editingId; // se movió a una combinación ocupada
  } else if (W.editingId) target = DB.get('evaluations', W.editingId);

  W.saving = true;
  try {
    const rec = target ? {...target} : {id:uid()};
    Object.assign(rec, {student_id:W.studentId, period:W.period, field:W.field, activity_id:W.activityId, score:W.score, observation:clean(W.obs), sample:!!st.sample});
    if (!target || dup) rec.date = new Date().toISOString();   // nueva o reemplazada: fecha de hoy; edición: conserva la fecha original
    await DB.put('evaluations', rec);
    if (removeId) await DB.del('evaluations', removeId);
    await saveSettings({lastPeriod:W.period, currentGroupId:st.group_id});
    LAST = {rec, mode: dup ? 'replace' : W.editingId ? 'edit' : 'new'};
    const from = W.from;
    W = null;
    if (from) { go(from.name, from.params, true); toast(LAST.mode === 'replace' ? 'Evaluación reemplazada' : 'Cambios guardados'); }
    else go('saved', {}, true);
  } catch(e) {
    W.saving = false;
    toast('No se pudo guardar: ' + (e && e.message ? e.message : 'error'));
  }
}

VIEWS.saved = () => {
  if (!LAST) { setTimeout(() => go('home', {}, true)); return ''; }
  const e = LAST.rec, st = DB.get('students', e.student_id), a = DB.get('activities', e.activity_id);
  const title = {new:'Evaluación guardada', edit:'Cambios guardados', replace:'Evaluación reemplazada'}[LAST.mode];
  return `<div class="saved">
      <div class="check" aria-hidden="true">✓</div>
      <h1>${title}</h1>
      <p><b>${esc(st ? st.name : '')}</b><br>${esc(fieldOf(e.field).name)} · ${esc(a ? a.name : '')}<br>${periodOf(e.period).name} · Puntaje ${e.score}</p>

/* ============================================================
   Fase 2: cálculos, historial, concentración, actividades y observaciones

/* ---------- Cálculos ----------
   Promedio de un campo en un periodo = promedio de las actividades evaluadas en ese campo.
   Anual de un campo = promedio de los periodos que tienen calificación en ese campo.
   Promedio general = promedio de los campos que tienen calificación. */
const ANUAL = 'ANUAL';
const PERIOD_TABS = [...PERIODS, {id:ANUAL, name:'Anual'}];
const periodName = id => id === ANUAL ? 'Evaluación Anual' : (periodOf(id) || {}).name || '';
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const r2 = v => Math.round(v * 100) / 100;
const fmtAvg = v => v == null ? '—' : String(r2(v));           // 9 · 8.5 · 8.67
const fmt2 = v => v == null ? '—' : r2(v).toFixed(2);           // 9.00
const level = v => v == null ? 'pend' : v < 6 ? 'low' : v < 8 ? 'mid' : 'ok';
const FIELD_SHORT = {LEN:'Lenguajes', SPC:'Saberes', ENS:'Ética', HYC:'Humano'};
const FIELD_ABBR = {LEN:'Leng.', SPC:'Sab.', ENS:'Ética', HYC:'Hum.'};

function buildIndex(){
  const idx = new Map();
  DB.list('evaluations').forEach(e => {
    const k = e.student_id + '|' + e.period + '|' + e.field;
    if (!idx.has(k)) idx.set(k, []);
    idx.get(k).push(e);
  });
  return idx;
}
function fieldValue(idx, sid, period, fid){
  if (period === ANUAL) return mean(PERIODS.map(p => fieldValue(idx, sid, p.id, fid)).filter(v => v != null));
  const list = idx.get(sid + '|' + period + '|' + fid);
  return list ? mean(list.map(e => e.score)) : null;
}
function studentRow(idx, sid, period){
  const vals = {};
  FIELDS.forEach(f => vals[f.id] = fieldValue(idx, sid, period, f.id));
  const got = FIELDS.map(f => vals[f.id]).filter(v => v != null);
  return {vals, avg: mean(got), done: got.length};
}

/* ---------- Concentración ---------- */
VIEWS.conc = p => {
  const gs = activeGroups();
  const g = DB.get('groups', p.groupId) || currentGroup() || gs[0];
  const period = PERIOD_TABS.some(x => x.id === p.period) ? p.period : (settings().lastPeriod || 'P1');
  if (!g) return `${topbar('Concentración')}<p class="empty" style="margin-top:16px">Primero crea un grupo.</p>`;
  const idx = buildIndex();
  const studs = studentsOf(g.id, true);
  const rows = studs.map(s => ({s, ...studentRow(idx, s.id, period)}));
  const complete = rows.filter(r => r.done === 4).length;
  const fieldAvgs = {}; FIELDS.forEach(f => fieldAvgs[f.id] = mean(rows.map(r => r.vals[f.id]).filter(v => v != null)));
  const groupAvg = mean(rows.map(r => r.avg).filter(v => v != null));
  const anyPartial = rows.some(r => r.done > 0 && r.done < 4);
  const cell = (r, f) => `<td><button class="cell lv-${level(r.vals[f.id])}" data-act="conc-cell" data-sid="${r.s.id}" data-field="${f.id}" data-period="${period}" aria-label="${esc(r.s.name)}, ${f.name}: ${r.vals[f.id] == null ? 'pendiente' : fmtAvg(r.vals[f.id])}">${fmtAvg(r.vals[f.id])}</button></td>`;
  return `${topbar('Concentración', g.name + ' · ' + periodName(period))}
    <div class="chips" style="margin-top:12px">${gs.map(x => `<button class="chip ${x.id === g.id ? 'on' : ''}" data-act="conc-go" data-group="${x.id}" data-period="${period}">${esc(x.name)}${testTag(x)}</button>`).join('')}</div>
    <div class="tabs" role="tablist">${PERIOD_TABS.map(x => `<button class="tab ${x.id === period ? 'on' : ''}" role="tab" aria-selected="${x.id === period}" data-act="conc-go" data-group="${g.id}" data-period="${x.id}">${x.id === ANUAL ? 'Anual' : x.name.replace(' Periodo', '')}</button>`).join('')}</div>
    <div class="kpis">
      <div><b>${fmt2(groupAvg)}</b><span>Promedio del grupo</span></div>
      <div><b>${complete}/${studs.length}</b><span>Con los 4 campos</span></div>
      <div><b>${studs.length - complete}</b><span>Con campos pendientes</span></div>
    </div>
    ${studs.length ? `<div class="tblwrap"><table class="conc">
      <thead><tr><th class="c-name" scope="col">Alumno</th>${FIELDS.map(f => `<th scope="col" class="fh ${f.cls}" title="${f.name}"><span class="lg">${FIELD_SHORT[f.id]}</span><span class="sh">${FIELD_ABBR[f.id]}</span></th>`).join('')}<th scope="col" class="c-avg"><span class="lg">Promedio</span><span class="sh">Prom.</span></th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><th class="c-name" scope="row"><span class="num">${i + 1}</span><span class="nm">${esc(r.s.name)}</span></th>${FIELDS.map(f => cell(r, f)).join('')}
        <td class="c-avg"><b class="lv-${level(r.avg)}">${fmt2(r.avg)}</b>${r.done > 0 && r.done < 4 ? '<sup>*</sup>' : ''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th class="c-name" scope="row">Promedio del grupo</th>${FIELDS.map(f => `<td>${fmtAvg(fieldAvgs[f.id])}</td>`).join('')}<td class="c-avg"><b>${fmt2(groupAvg)}</b></td></tr></tfoot>
    </table></div>
    <p class="legend"><span>— Pendiente</span><span><i class="sw lv-low"></i>Menor a 6</span><span><i class="sw lv-mid"></i>6 a 7.9</span>${anyPartial ? '<span>* Promedio parcial: faltan campos</span>' : ''}</p>
    <p class="hint">${period === ANUAL ? 'Anual: cada campo es el promedio de los periodos que tienen calificación.' : 'Cada campo es el promedio de sus actividades en el periodo.'} Toca una calificación para ver el detalle.</p>
    <div class="actions" style="margin-top:12px"><button class="btn ghost" data-act="conc-export" data-group="${g.id}" data-period="${period}">⬇︎ Exportar concentración</button></div>`
    : '<p class="empty">Este grupo no tiene alumnos activos.</p>'}`;
};

const actName = e => { const a = DB.get('activities', e.activity_id); return a ? a.name : 'Actividad eliminada'; };

/* ---------- Historial ---------- */
const HF = {group:'', student:'', period:'', field:'', activity:'', from:'', to:'', open:false, limit:50};
const ymd = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function histFiltered(){
  const studs = new Map(DB.list('students').map(s => [s.id, s]));
  return DB.list('evaluations').filter(e => {
    const s = studs.get(e.student_id);
    if (HF.group && (!s || s.group_id !== HF.group)) return false;
    if (HF.student && e.student_id !== HF.student) return false;
    if (HF.period && e.period !== HF.period) return false;
    if (HF.field && e.field !== HF.field) return false;
    if (HF.activity && e.activity_id !== HF.activity) return false;

    if (HF.from && d < HF.from) return false;
    if (HF.to && d > HF.to) return false;
    return true;
  }).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.updated_at || '').localeCompare(a.updated_at || ''));

/* ---------- Carga de librerías bajo demanda ----------
   En la app instalada (la página trae su manifiesto) las librerías van incluidas y funcionan sin Internet. */
const INSTALLED_BUILD = !!document.querySelector('link[rel="manifest"]');
const libSrc = (file, cdn) => INSTALLED_BUILD ? './' + file : cdn;
const scriptCache = {};
function loadScript(src){
  if (!scriptCache[src]) scriptCache[src] = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => res();
    sc.onerror = () => { delete scriptCache[src]; sc.remove(); rej(new Error('Para generar este archivo se necesita Internet la primera vez. Conéctate e inténtalo de nuevo.')); };
    document.head.appendChild(sc);
  });
  return scriptCache[src];
}
async function loadPDF(){
  if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(libSrc('jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'));
  if (!window.jspdf.jsPDF.API.autoTable) await loadScript(libSrc('jspdf.plugin.autotable.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'));
}

/* ---------- Guardar archivos ----------
   Dentro de Claude se usa la confirmación de descarga del visor; en un navegador normal, la descarga de siempre. */
const DOWNLOADS = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, data){
  const dl = await DOWNLOADS;
  if (dl) {
    try { await dl.save({filename, data}); toast('Archivo guardado: ' + filename); return true; }
    catch(e) {
      const c = e && e.code;
      if (c === 'declined') return false;
      if (c === 'rate_limited') { toast('Ya hay una descarga pendiente. Espera un momento.'); return false; }
      toast('Este visor no permitió guardar el archivo.'); return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Descargando ' + filename);
  return true;
}
const fileSlug = s => String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[º°]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
const today = () => ymd(new Date().toISOString());
const longDate = (d = new Date()) => d.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});

/* CSV en UTF-8 con BOM: Excel lo abre con acentos, Ñ y ü correctos. */
const csvCell = v => { const s = v == null ? '' : String(v); return /[",\r\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
async function toXLSX(sheets){
  await loadXLSX();
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh => {
    const ws = XLSX.utils.aoa_to_sheet(sh.rows);
    ws['!cols'] = sh.rows[0].map((_, i) => ({wch: Math.min(48, Math.max(6, ...sh.rows.map(r => String(r[i] ?? '').length)) + 2)}));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  return new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})]);
}

/* ---------- Datos de reportes ---------- */
function groupData(gid, period){
  const g = DB.get('groups', gid), idx = buildIndex(), studs = studentsOf(gid, true);
  const rows = studs.map(s => ({s, ...studentRow(idx, s.id, period)}));
  const ids = new Set(studs.map(s => s.id));
  const periods = period === ANUAL ? PERIODS.map(p => p.id) : [period];
  const nEvals = DB.list('evaluations').filter(e => ids.has(e.student_id) && periods.includes(e.period)).length;
  const fieldAvgs = {}, fieldN = {};
  FIELDS.forEach(f => { const v = rows.map(r => r.vals[f.id]).filter(x => x != null); fieldAvgs[f.id] = mean(v); fieldN[f.id] = v.length; });
  const groupAvg = mean(rows.map(r => r.avg).filter(v => v != null));
  const pending = rows.map(r => ({s:r.s, missing: FIELDS.filter(f => r.vals[f.id] == null)})).filter(x => x.missing.length);
  return {g, period, rows, nEvals, fieldAvgs, fieldN, groupAvg, pending, pendingPairs: pending.reduce((a, x) => a + x.missing.length, 0)};
}
function annualData(gid){
  const g = DB.get('groups', gid), idx = buildIndex(), studs = studentsOf(gid, true);
  const rows = studs.map(s => { const per = {}; PERIOD_TABS.forEach(p => per[p.id] = studentRow(idx, s.id, p.id)); return {s, per}; });
  const fieldPer = {}, genPer = {};
  FIELDS.forEach(f => { fieldPer[f.id] = {}; PERIOD_TABS.forEach(p => fieldPer[f.id][p.id] = mean(rows.map(r => r.per[p.id].vals[f.id]).filter(v => v != null))); });
  PERIOD_TABS.forEach(p => genPer[p.id] = mean(rows.map(r => r.per[p.id].avg).filter(v => v != null)));
  return {g, rows, fieldPer, genPer};
}
function studentData(sid){
  const s = DB.get('students', sid), g = s && DB.get('groups', s.group_id), idx = buildIndex();
  const per = {}; PERIOD_TABS.forEach(p => per[p.id] = studentRow(idx, sid, p.id));

    .sort((a, b) => a.period.localeCompare(b.period) || FIELDS.findIndex(f => f.id === a.field) - FIELDS.findIndex(f => f.id === b.field) || coll.compare(actName(a), actName(b)));

}

/* ---------- PDF ---------- */
const C_BRAND = [29, 82, 64], C_INK = [21, 33, 28], C_MUTED = [86, 101, 94], C_LINE = [211, 219, 211], C_SOFT = [232, 236, 229], C_LOW = [179, 50, 31];
function pdfStart(title, subtitle, g){
  const doc = new window.jspdf.jsPDF({orientation:'portrait', unit:'mm', format:'letter'});
  const W = doc.internal.pageSize.getWidth(), st = settings();
  const schoolName = g && g.school ? (/^escuela/i.test(g.school) ? g.school : 'Escuela ' + g.school) : 'Rafa Evalúa';
  const line2 = [g && g.cct && 'CCT ' + g.cct, g && g.turno && 'Turno ' + g.turno, st.cycle && 'Ciclo escolar ' + st.cycle].filter(Boolean).join('   ·   ');
  doc.setFillColor(...C_BRAND); doc.rect(15, 12, 1.4, st.teacher ? 15.5 : 11, 'F');
  doc.setTextColor(...C_INK); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(schoolName, 19, 16.2);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C_MUTED);
  if (line2) doc.text(line2, 19, 21.2);
  if (st.teacher) { doc.text('Docente: ', 19, 25.8); doc.setTextColor(...C_INK); doc.text(st.teacher, 19 + doc.getTextWidth('Docente: '), 25.8); }
  doc.setTextColor(...C_MUTED); doc.text(longDate(), W - 15, 16.2, {align:'right'});
  doc.setTextColor(...C_BRAND); doc.setFont('helvetica', 'bold'); doc.text('Evaluación formativa NEM', W - 15, 21.2, {align:'right'});
  doc.setDrawColor(...C_LINE); doc.setLineWidth(0.3); doc.line(15, 30.5, W - 15, 30.5);
  doc.setTextColor(...C_INK); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(title, 15, 40);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...C_MUTED); doc.text(subtitle, 15, 46);
  doc._y = 52;
  return doc;
}
function pdfKpis(doc, items){
  const W = doc.internal.pageSize.getWidth(), w = (W - 30 - (items.length - 1) * 4) / items.length;
  items.forEach(([label, value], i) => {
    const x = 15 + i * (w + 4);
    doc.setFillColor(...C_SOFT); doc.roundedRect(x, doc._y, w, 16, 2, 2, 'F');
    doc.setTextColor(...C_INK); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text(String(value), x + 4, doc._y + 7.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C_MUTED); doc.text(label, x + 4, doc._y + 12.8);
  });
  doc._y += 23;
}
function pdfSection(doc, text){
  if (doc._y > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); doc._y = 18; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...C_INK); doc.text(text, 15, doc._y);
  doc._y += 3;
}
function pdfTable(doc, rows, opts = {}){
  const [head, ...body] = rows;
  const foot = opts.foot ? [body.pop()] : undefined;
  doc.autoTable({
    startY: doc._y, head:[head], body, foot, theme:'grid', showFoot:'lastPage',
    margin:{left:15, right:15, top:16, bottom:18},
    styles:{font:'helvetica', fontSize: opts.fontSize || 9, cellPadding:1.7, lineColor:C_LINE, lineWidth:0.2, textColor:C_INK, valign:'middle', overflow:'linebreak'},
    headStyles:{fillColor:C_BRAND, textColor:255, fontStyle:'bold', halign:'center', fontSize: (opts.fontSize || 9) - 0.5},
    footStyles:{fillColor:C_SOFT, textColor:C_INK, fontStyle:'bold', halign:'center'},
    alternateRowStyles:{fillColor:[247, 249, 246]},
    columnStyles: opts.columnStyles || {},
    didParseCell: data => {
      if (data.section === 'body' && opts.center && data.column.index >= opts.center) data.cell.styles.halign = 'center';
      const v = data.cell.raw;
      if (data.section === 'body' && opts.center && data.column.index >= opts.center && v !== '' && v != null && !isNaN(+v) && +v < 6) { data.cell.styles.textColor = C_LOW; data.cell.styles.fontStyle = 'bold'; }
      if (data.section === 'body' && (v === 'Pendiente' || v === '—')) data.cell.styles.textColor = C_MUTED;
      if (data.section === 'foot' && data.column.index < (opts.center || 1)) data.cell.styles.halign = 'left';
    }
  });
  doc._y = doc.lastAutoTable.finalY + 9;
}
function pdfFinish(doc, label){
  const n = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C_MUTED);
    doc.text(label, 15, H - 9); doc.text(`Página ${i} de ${n}`, W - 15, H - 9, {align:'right'});
  }
  return doc.output('blob');
}
const pdfNum = v => v == null ? '—' : r2(v);
const dash = v => v === 'Pendiente' ? '—' : v;
function pdfNote(doc, text){ doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C_MUTED); doc.text(text, 15, doc._y - 5); doc._y += 2; }

async function quickScore(sid, v){
  const s = DB.get('students', sid); if (!s) return;
  const e = findEval(sid, Q.period, Q.field, Q.activityId);
  if (e && e.score === v) return;
  if (e && Q.base.has(e.id) && !Q.ok.has(e.id)) {
    const ok = await confirmBox('⚠️ Ya tenía calificación', `<p><b>${esc(s.name)}</b> ya tiene <b>${e.score}</b> en esta actividad (registrada el ${fmtDate(e.date)}).</p><p>¿Reemplazarla por <b>${v}</b>?</p>`, 'Reemplazar', 'primary');
    if (!ok) return;
    Q.ok.add(e.id);
  }
  const rec = e ? {...e, score:v} : {id:uid(), student_id:sid, period:Q.period, field:Q.field, activity_id:Q.activityId, score:v, observation:'', date:new Date().toISOString(), sample:!!s.sample};
  try { await DB.put('evaluations', rec); } catch(err) { toast('No se pudo guardar.'); }
  keepScroll();
}
async function quickObs(sid){
  const e = findEval(sid, Q.period, Q.field, Q.activityId), s = DB.get('students', sid);

      <div class="field"><label class="sr" for="f-qobs">Observación</label><textarea id="f-qobs" maxlength="300" placeholder="Escribe una observación o elige una">${esc(e.observation || '')}</textarea></div>
      <div class="obs-chips" style="margin-top:10px">${observations().map(o => `<button class="obs-chip" data-act="q-obs-pick" data-text="${esc(o.text)}">${esc(o.text)}</button>`).join('')}</div>`,

/* ---------- Importar lista de alumnos ----------
   Acepta .xlsx, .xls, .ods (con SheetJS, se carga solo al usarlo), .csv/.txt

let IMP = null;
let xlsxLoading = null;
const CURP_RE = /^[A-Z]{4}\d{6}[HMX][A-Z]{5}[A-Z0-9]\d$/i;

function startImport(gid){

function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = libSrc('xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    sc.onload = () => res();
    sc.onerror = () => { xlsxLoading = null; sc.remove(); rej(new Error('Para leer archivos de Excel se necesita Internet la primera vez. Sin conexión puedes usar un archivo CSV o pegar la lista.')); };
    document.head.appendChild(sc);
  });
  return xlsxLoading;
}
function decodeText(buf){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function parseDelimited(text){
  text = text.replace(/^﻿/, '');
  const sample = text.split(/\r\n|\n|\r/).slice(0, 30).join('\n');
  const count = d => sample.split(d).length - 1;
  const delim = ['\t', ';', ','].sort((a, b) => count(b) - count(a))[0];
  if (!count(delim)) return text.split(/\r\n|\n|\r/).map(l => [l]);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows;
}
// Lo pegado desde Excel llega separado por tabuladores; una lista simple, un nombre por renglón.
const parsePasted = t => t.replace(/^﻿/, '').split(/\r\n|\n|\r/).map(l => l.split('\t'));

async function readImportFile(file){
  IMP.error = ''; IMP.loading = true; IMP.fileName = file.name; render();
  try {
    const ext = (file.name.includes('.') ? file.name.split('.').pop() : '').toLowerCase();
    const buf = await file.arrayBuffer();
    // Algunos teléfonos entregan el archivo sin extensión: se reconoce por su contenido.
    const b = new Uint8Array(buf.slice(0, 4));
    const isBook = (b[0] === 0x50 && b[1] === 0x4B) || (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0);
    let sheets;
    if (['xlsx', 'xls', 'ods', 'xlsm'].includes(ext) || (isBook && !['csv', 'txt', 'tsv'].includes(ext))) {
      await loadXLSX();
      const wb = XLSX.read(buf, {type:'array'});
      sheets = wb.SheetNames.map(n => ({name:n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:''})}));
    } else if (['csv', 'txt', 'tsv', ''].includes(ext)) sheets = [{name:file.name, rows: parseDelimited(decodeText(buf))}];
    else throw new Error('Ese tipo de archivo no se puede leer. Usa Excel (.xlsx o .xls), LibreOffice (.ods) o CSV.');
    loadRows(sheets, file.name);
  } catch(e) {
    IMP.loading = false; IMP.an = null; IMP.sheets = null;
    IMP.error = (e && e.message && !/^[A-Z][a-z]+Error/.test(e.message)) ? e.message : 'No se pudo leer el archivo. Revisa que no esté dañado o protegido con contraseña.';
    render();
  }
}
function loadRows(sheets, label){
  IMP.loading = false; IMP.fileName = label; IMP.error = '';
  IMP.sheets = sheets.filter(s => s.rows.some(r => (r || []).some(c => clean(c))));
  if (!IMP.sheets.length) { IMP.sheets = null; IMP.an = null; IMP.error = 'El archivo no tiene datos.'; render(); return; }
  // Hoja inicial: la que tenga más renglones con aspecto de nombre.
  let best = 0, bestScore = -1;
  IMP.sheets.forEach((s, i) => { const a = analyze(s.rows); const sc = a.options.length ? impItems(a, a.defaultOpt).filter(x => x.status === 'new').length : 0; if (sc > bestScore) { best = i; bestScore = sc; } });
  IMP.sheetIdx = best; analyzeCurrent();

}
function analyzeCurrent(){

const isNameLike = v => { const c = clean(v); return c.length >= 5 && c.length <= 90 && /\p{L}/u.test(c) && !/\d/.test(c) && c.split(' ').length >= 2; };
function analyze(raw){
  const rows = raw.map(r => (r || []).map(v => clean(v == null ? '' : String(v)))).filter(r => r.some(Boolean));
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    if (rows[i].some(c => c.length < 45 && /nombre|apellido|alumn|estudiante/i.test(c))) { h = i; break; }
  }
  const headers = h >= 0 ? rows[h] : [];
  const body = rows.slice(h + 1);
  const width = Math.max(1, ...rows.map(r => r.length));
  const hn = headers.map(x => norm(x || ''));
  const find = re => hn.findIndex(x => re.test(x));
  const pat = find(/primer apellido|apellido paterno|^paterno|ap\.? ?paterno|^apellido 1/);
  const mat = find(/segundo apellido|apellido materno|^materno|ap\.? ?materno|^apellido 2/);
  const aps = find(/^apellidos$/);
  const full = find(/nombre completo|nombre del alumno|nombre del estudiante|nombre de la alumna|^alumn[oa]s?$|^estudiantes?$|apellidos y nombre|nombre y apellido/);
  const nom = hn.findIndex((x, i) => i !== full && /^nombres?\b|^nombre ?\(s\)/.test(x));
  const letter = i => i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
  const options = [];
  const surname = pat >= 0 ? pat : aps;
  if (surname >= 0 && nom >= 0) {
    const cols = [surname, mat, nom].filter((x, k) => x >= 0 && (k !== 1 || surname === pat));
    options.push({id:'combo', cols, require:nom, label:`Apellidos y nombre(s) juntos (columnas ${cols.map(letter).join(', ')})`});
  }
  const score = i => body.filter(r => isNameLike(r[i])).length;
  for (let i = 0; i < width; i++) {
    const vals = body.map(r => r[i] || '').filter(Boolean);
    if (!vals.some(v => /\p{L}/u.test(v))) continue;
    if (vals.filter(v => CURP_RE.test(v)).length > vals.length / 2) continue;
    options.push({id:'c' + i, cols:[i], label: headers[i] ? `${headers[i]} (columna ${letter(i)})` : `Columna ${letter(i)}`, score: score(i)});
  }
  let defaultOpt = null;
  if (options.some(o => o.id === 'combo')) defaultOpt = 'combo';
  else if (full >= 0 && options.some(o => o.id === 'c' + full)) defaultOpt = 'c' + full;
  else if (nom >= 0 && options.some(o => o.id === 'c' + nom)) defaultOpt = 'c' + nom;
  else { const b = options.filter(o => o.score != null).sort((a, b) => b.score - a.score)[0]; defaultOpt = b ? b.id : null; }
  const allCaps = body.slice(0, 40).some(r => r.some(c => isNameLike(c) && c === c.toLocaleUpperCase('es')));
  return {body, headerSet:new Set(hn.filter(Boolean)), options, defaultOpt, allCaps};

function properCase(s){
  return s.toLocaleLowerCase('es').split(' ').map((w, i) => (i > 0 && LOWER_WORDS.has(w)) ? w
    : w.split('-').map(p => p.charAt(0).toLocaleUpperCase('es') + p.slice(1)).join('-')).join(' ');
}
function impItems(an = IMP && IMP.an, optId = IMP && IMP.optId){
  if (!an) return [];
  const opt = an.options.find(o => o.id === optId); if (!opt) return [];
  const existing = (IMP && IMP.target !== 'new') ? DB.list('students').filter(s => s.group_id === IMP.target) : [];
  const seen = [], out = [];
  an.body.forEach(r => {
    if (opt.require != null && !clean(r[opt.require])) return;
    // Con columnas separadas, cada celda se ajusta por su cuenta: «DEL REAL» → «Del Real», «MARÍA DE LOS ÁNGELES» → «María de los Ángeles».
    const fix = v => { v = clean(v); return (IMP && IMP.proper && v && v === v.toLocaleUpperCase('es') && /\p{L}/u.test(v)) ? properCase(v) : v; };
    // Formato del sistema de control escolar: «AGUILAR / CRUZ * MIGUEL ANGEL» → «Aguilar Cruz Miguel Angel».
    let name = clean(opt.cols.map(i => fix(String(r[i] || '').replace(/\s*[\/*]\s*/g, ' '))).join(' ')).replace(/^\d+\s*[.\-)]?\s+/, '');
    if (!name || !/\p{L}/u.test(name) || /\d/.test(name) || CURP_RE.test(name.replace(/\s/g, ''))) return;
    if (an.headerSet.has(norm(name))) return;
    let status = 'new';
    const ex = existing.find(s => coll.compare(s.name, name) === 0);

    else if (seen.some(n => coll.compare(n, name) === 0)) status = 'repeat';

async function doImport(){
  const items = impItems().filter(x => x.on), n = items.length;
  if (!n) return;
  let g = IMP.target === 'new' ? null : DB.get('groups', IMP.target);
  const gname = g ? g.name : clean(IMP.newName);
  if (!g) {
    if (!gname) { toast('Escribe el nombre del grupo nuevo.'); const el = $('#imp-newname'); el && el.focus(); return; }
    if (groupNameTaken(gname)) { toast('Ya existe un grupo con ese nombre. Elígelo en la lista.'); return; }
  }
  const skipped = impItems().length - n;
  const ok = await confirmBox(`¿Importar ${n} ${n === 1 ? 'alumno' : 'alumnos'}?`,
    `<p>Se agregarán como alumnos activos ${g ? 'al grupo' : 'al grupo nuevo'} <b>${esc(gname)}</b>.</p>${skipped ? `<p class="hint">${skipped} ${skipped === 1 ? 'renglón no se importará' : 'renglones no se importarán'} (ya existen, repetidos o sin marcar).</p>` : ''}`,
    'Importar', 'primary');
  if (!ok) return;
  let gid = g && g.id;
  const done = await safe(async () => {
    if (!g) { g = {id:uid(), name:gname, active:true, ...guessSchool(gname)}; gid = g.id; await DB.put('groups', g); }
    await DB.putMany('students', items.map(x => ({id:uid(), name:x.name, group_id:gid, active:true})));
    const cur = currentGroup();
    if (!cur || cur.sample || IMP.target === 'new') await saveSettings({currentGroupId:gid});
  }, `${n} ${n === 1 ? 'alumno importado' : 'alumnos importados'} a ${gname}`);
  if (done) { IMP = null; go('students', {groupId:gid}, true); }
}

/* ---------- Respaldo y restauración ---------- */
const BACKUP_STORES = ['groups','students','activities','evaluations','observations','settings'];
function backupObject(){
  const data = {}; BACKUP_STORES.forEach(st => data[st] = DB.list(st));
  return {app:'Rafa Evalúa', format:1, exported_at:new Date().toISOString(),
    counts:{grupos:data.groups.length, alumnos:data.students.length, evaluaciones:data.evaluations.length}, data};
}
async function markBackup(){ try { await saveSettings({lastBackup:new Date().toISOString()}); } catch(e){} render(); }
function parseBackup(text){
  let o;
  try { o = JSON.parse(String(text).replace(/^\uFEFF/, '').trim()); } catch(e) { throw new Error('El archivo no es un respaldo válido de Rafa Evalúa.'); }
  if (!o || o.format !== 1 || !o.data || !Array.isArray(o.data.groups) || !Array.isArray(o.data.students) || !Array.isArray(o.data.evaluations))
    throw new Error('El archivo no es un respaldo válido de Rafa Evalúa.');
  const ok = r => r && typeof r.id === 'string';
  BACKUP_STORES.forEach(st => { o.data[st] = (o.data[st] || []).filter(ok); });
  return o;
}
async function restoreBackup(text){
  let o;
  try { o = parseBackup(text); } catch(e) { toast(e.message); return; }
  const d = o.data, nReal = DB.list('evaluations').length;
  const ok = await confirmBox('¿Restaurar este respaldo?',
    `<div class="dup-card">Respaldo del <b>${fmtDate(o.exported_at)}</b><br>${d.groups.length} grupos · ${d.students.length} alumnos · ${d.evaluations.length} evaluaciones · ${(d.activities || []).length} actividades</div>
     <p>Se <b>reemplazarán</b> todos los datos de este dispositivo${nReal ? ` (hoy tiene ${nReal} evaluaciones)` : ''}. Esta acción no se puede deshacer.</p>`, 'Restaurar', 'danger');
  if (!ok) return;
  const done = await safe(async () => {
    const keep = settings();
    const st = (d.settings || []).find(x => x.id === 'app') || {id:'app'};
    // Se conserva la marca de "ya se cargaron datos iniciales" para no volver a crear datos de prueba.
    d.settings = [{...st, seeded:true, schoolsSeeded: st.schoolsSeeded ?? keep.schoolsSeeded, lastBackup: st.lastBackup || o.exported_at}];
    await DB.replaceAll(d);
  }, `Respaldo restaurado: ${d.students.length} alumnos y ${d.evaluations.length} evaluaciones`);
  if (done) go('home', {}, true);
}

    const ok = await confirmBox('¿Quitar los datos de prueba?', '<p>Se borrarán el grupo, los alumnos y las evaluaciones marcados como prueba. Tus grupos, alumnos y evaluaciones reales no se tocan.</p>', 'Quitar datos de prueba');
    if (!ok) return;
    await safe(async () => {
      const sStu = new Set(DB.list('students').filter(s => s.sample).map(s => s.id));
      await DB.delMany('evaluations', DB.list('evaluations').filter(e => e.sample || sStu.has(e.student_id)).map(e => e.id));
      await DB.delMany('students', [...sStu]);
      // Un grupo de prueba al que agregaste alumnos reales se conserva y deja de ser de prueba.
      const sGroups = DB.list('groups').filter(g => g.sample);
      const keep = sGroups.filter(g => DB.list('students').some(st => st.group_id === g.id));
      await DB.delMany('groups', sGroups.filter(g => !keep.includes(g)).map(g => g.id));
      if (keep.length) await DB.putMany('groups', keep.map(g => ({...g, sample:false})));
      if (!currentGroup()) { const n = activeGroups()[0]; await saveSettings({currentGroupId: n ? n.id : null}); }
    }, 'Datos de prueba eliminados');
  },
  'sample-load': () => safe(async () => {
    if (!DB.list('activities').length) await seedCatalog();
    const gid = await seedSample();
    if (!currentGroup()) await saveSettings({currentGroupId:gid});
  }, 'Datos de prueba cargados')
};
document.addEventListener('change', async e => {
  if (e.target.id !== 'bk-file' || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = '';
  try { await restoreBackup(await f.text()); } catch(err) { toast('No se pudo leer el archivo.'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-gschool') {
    const v = e.target.value, sc = schools().find(x => x.name === v);
    $('#f-gother-wrap').hidden = v !== '__new';
    if (sc) { $('#f-gcct').value = sc.cct || ''; $('#f-gturno').value = sc.turno || ''; }
    if (v === '__new') { $('#f-gcct').value = ''; $('#f-gturno').value = ''; $('#f-gother').focus(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'q-only' && Q) { Q.onlyPending = e.target.checked; render(); }
  if (e.target.id === 'rp-student') { RP.studentId = e.target.value; render(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.hf;
  if (!k) return;
  HF[k] = e.target.value; HF.limit = 50;
  if (k === 'group') HF.student = '';
  if (k === 'field') HF.activity = '';
  render();
});
document.addEventListener('change', e => {
  const t = e.target; if (!IMP || route.name !== 'import') return;
  if (t.id === 'imp-file' && t.files && t.files[0]) readImportFile(t.files[0]);
  else if (t.id === 'imp-group') { IMP.target = t.value; IMP.over.clear(); render(); if (t.value === 'new') setTimeout(() => { const n = $('#imp-newname'); n && n.focus(); }, 30); }
  else if (t.id === 'imp-sheet') { IMP.sheetIdx = +t.value; analyzeCurrent(); render(); }
  else if (t.id === 'imp-opt') { IMP.optId = t.value; IMP.over.clear(); render(); }
  else if (t.id === 'imp-proper') { IMP.proper = t.checked; IMP.over.clear(); render(); }
  else if (t.dataset.idx != null) { IMP.over.set(+t.dataset.idx, t.checked); const y = window.scrollY; render(); window.scrollTo(0, y); }
});
function syncObsBtn(){ const b = $('#obs-next'); if (b) b.textContent = W.obs.trim() ? 'Continuar' : 'Continuar sin observación'; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q' && W) $('#stu-list').innerHTML = pickRows(norm(t.value.trim()));
  if (t.id === 'sq') $('#stu-rows').innerHTML = studentRows(t.dataset.gid, t.dataset.tab, norm(t.value.trim()));
  if (t.id === 'imp-newname' && IMP) IMP.newName = t.value;
  if (t.id === 'imp-paste' && IMP) IMP.pasteText = t.value;
  if (t.id === 'obs' && W) { W.obs = t.value; $('#obs-chips').innerHTML = obsChips(); syncObsBtn(); }
});
document.addEventListener('keydown', e => {
  const root = $('#modal-root');
  if (root.hidden) return;
  if (e.key === 'Escape') closeModal(null);
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const i = (root._actions || []).findIndex(a => a.submit);
    if (i >= 0) { e.preventDefault(); modalButton(i); }
  }
});

function render(){ const v = VIEWS[route.name] || VIEWS.home; $('#app').innerHTML = v(route.params || {}); }

(async () => {
  await DB.init();
  try { await firstRun(); } catch(e) {}
  try { await migrateSchools(); } catch(e) {}
  try { history.replaceState({route, idx:0}, ''); } catch(e) {}
  render();
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
